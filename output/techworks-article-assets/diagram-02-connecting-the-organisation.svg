<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Connecting the Organisation</title>
  <desc id="desc">People, processes and information converge into Operational Capability, then begin to interconnect as one connected organisation.</desc>
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="53%">
      <stop offset="0%" stop-color="#20385B" stop-opacity="0.8"/>
      <stop offset="72%" stop-color="#0D1C31" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#07121F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peopleFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3FBFF"/>
      <stop offset="100%" stop-color="#6DD8E7"/>
    </linearGradient>
    <linearGradient id="processFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74E0EE"/>
      <stop offset="100%" stop-color="#7C6DDD"/>
    </linearGradient>
    <linearGradient id="infoFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D8CF0"/>
      <stop offset="100%" stop-color="#BFE8FF"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#01070E" flood-opacity="0.36"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#DFF4FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#07121F"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="800" cy="532" r="430" fill="url(#centerGlow)"/>

  <text x="92" y="108" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="650">CONNECTING THE ORGANISATION</text>
  <text x="92" y="148" fill="#9FDCF3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="1.3">Progress happens when people, systems and information work together</text>

  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M486 330C570 352 635 395 693 456" stroke="url(#peopleFlow)"/>
    <path d="M458 520C548 523 620 528 690 532" stroke="url(#processFlow)"/>
    <path d="M486 708C570 686 635 641 693 581" stroke="url(#infoFlow)"/>
    <path d="M907 458C980 394 1066 359 1180 346" stroke="#DFF4FF" opacity="0.5" stroke-dasharray="4 12"/>
    <path d="M910 533C1008 531 1100 540 1195 562" stroke="#63D3E6" opacity="0.5" stroke-dasharray="4 12"/>
    <path d="M907 580C986 654 1078 699 1194 722" stroke="#8D7DE2" opacity="0.5" stroke-dasharray="4 12"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M800 388L925 460V604L800 676L675 604V460Z" fill="#102842" stroke="#EAF8FF" stroke-width="2.5"/>
    <path d="M800 414L900 473V591L800 650L700 591V473Z" fill="#153757" stroke="#61D3E6" stroke-width="1.2" opacity="0.72"/>
    <text x="800" y="515" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="670">Operational</text>
    <text x="800" y="560" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="670">Capability</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(235 265)">
      <text x="0" y="-52" fill="#FFFFFF" font-size="30" font-weight="650">People</text>
      <line x1="108" y1="0" x2="108" y2="46" stroke="#DFF4FF" stroke-width="2"/>
      <line x1="30" y1="78" x2="186" y2="78" stroke="#DFF4FF" stroke-width="2"/>
      <line x1="30" y1="78" x2="30" y2="122" stroke="#DFF4FF" stroke-width="2"/>
      <line x1="108" y1="78" x2="108" y2="122" stroke="#DFF4FF" stroke-width="2"/>
      <line x1="186" y1="78" x2="186" y2="122" stroke="#DFF4FF" stroke-width="2"/>
      <g fill="#0E2741" stroke="#BFE8FF" stroke-width="2">
        <circle cx="108" cy="0" r="24"/>
        <circle cx="30" cy="146" r="22"/>
        <circle cx="108" cy="146" r="22"/>
        <circle cx="186" cy="146" r="22"/>
      </g>
      <g fill="#55C8E8">
        <circle cx="108" cy="0" r="7"/>
        <circle cx="30" cy="146" r="6"/>
        <circle cx="108" cy="146" r="6"/>
        <circle cx="186" cy="146" r="6"/>
      </g>
    </g>

    <g transform="translate(218 502)">
      <text x="0" y="-58" fill="#FFFFFF" font-size="30" font-weight="650">Processes</text>
      <g stroke="#BFE8FF" stroke-width="2" fill="#0D253D">
        <rect x="0" y="-28" width="102" height="56" rx="8"/>
        <rect x="147" y="-28" width="102" height="56" rx="8"/>
        <rect x="294" y="-28" width="102" height="56" rx="8"/>
      </g>
      <g stroke="#72DDEB" stroke-width="2.4" fill="none" stroke-linecap="round">
        <path d="M102 0H137"/>
        <path d="M249 0H284"/>
        <path d="M132 -8L142 0L132 8"/>
        <path d="M279 -8L289 0L279 8"/>
      </g>
      <g fill="#FFFFFF" opacity="0.82">
        <circle cx="51" cy="0" r="5"/>
        <circle cx="198" cy="0" r="5"/>
        <circle cx="345" cy="0" r="5"/>
      </g>
    </g>

    <g transform="translate(235 686)">
      <text x="0" y="-54" fill="#FFFFFF" font-size="30" font-weight="650">Information</text>
      <g fill="none" stroke="#A899F3" stroke-width="1.8">
        <path d="M42 78L100 25L172 64L230 12L280 88"/>
        <path d="M100 25L122 116L230 12"/>
        <path d="M42 78L122 116L280 88"/>
      </g>
      <g fill="#0E2741" stroke="#DFF4FF" stroke-width="2">
        <circle cx="42" cy="78" r="20"/>
        <circle cx="100" cy="25" r="18"/>
        <circle cx="172" cy="64" r="22"/>
        <circle cx="230" cy="12" r="18"/>
        <circle cx="280" cy="88" r="20"/>
        <circle cx="122" cy="116" r="17"/>
      </g>
      <g fill="#61D3E6">
        <circle cx="42" cy="78" r="5"/>
        <circle cx="100" cy="25" r="5"/>
        <circle cx="172" cy="64" r="6"/>
        <circle cx="230" cy="12" r="5"/>
        <circle cx="280" cy="88" r="5"/>
        <circle cx="122" cy="116" r="5"/>
      </g>
    </g>
  </g>

  <g fill="none" stroke-width="1.6" stroke-linecap="round" opacity="0.56">
    <path d="M1180 346C1256 424 1249 621 1194 722" stroke="#DFF4FF"/>
    <path d="M1195 562C1110 488 1090 420 1180 346" stroke="#6DD8E7"/>
    <path d="M1195 562C1132 606 1127 671 1194 722" stroke="#8D7DE2"/>
  </g>

  <g transform="translate(1210 290)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="-16" fill="#DFF4FF" font-size="23" font-weight="600">Connected organisation</text>
    <g fill="#0B2036" stroke="#DFF4FF" stroke-width="1.8">
      <circle cx="52" cy="58" r="26"/>
      <circle cx="198" cy="88" r="22"/>
      <circle cx="120" cy="188" r="28"/>
      <circle cx="250" cy="244" r="24"/>
      <circle cx="64" cy="330" r="22"/>
    </g>
    <g fill="#61D3E6">
      <circle cx="52" cy="58" r="7"/>
      <circle cx="198" cy="88" r="6"/>
      <circle cx="120" cy="188" r="7"/>
      <circle cx="250" cy="244" r="6"/>
      <circle cx="64" cy="330" r="6"/>
    </g>
  </g>
</svg>
