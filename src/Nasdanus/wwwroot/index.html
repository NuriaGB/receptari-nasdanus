<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3891a6" />
    <base href="/receptari-nasdanus/" />
    <title>Nasdanus</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon-512.svg" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Nasdanus.styles.css" />
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading-mark">N</div>
            <div>Carregant Nasdanus...</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">x</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        async function clearStalePwaCaches() {
            if (!("caches" in window)) {
                return;
            }

            const cacheKeys = await caches.keys();
            await Promise.all(
                cacheKeys
                    .filter(key => key.startsWith("nasdanus-pwa-"))
                    .map(key => caches.delete(key)));
        }

        window.nasdanusData = {
            downloadTextFile: (fileName, content, contentType) => {
                const blob = new Blob([content], { type: contentType || "application/json;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            },
            copyText: async (text) => {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return;
                }

                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.left = "-9999px";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            },
            printRecipe: () => {
                document.body.classList.add("recipe-print");
                const cleanup = () => document.body.classList.remove("recipe-print");
                window.addEventListener("afterprint", cleanup, { once: true });
                setTimeout(() => {
                    window.print();
                    setTimeout(cleanup, 1000);
                }, 50);
            },
            getBrowserInfo: () => {
                const viewport = `${window.innerWidth}x${window.innerHeight}`;
                return `${navigator.userAgent} | ${navigator.language} | ${viewport}`;
            }
        };

        (async () => {
            try {
                await clearStalePwaCaches();
            } finally {
                await Blazor.start();
            }

            if ("serviceWorker" in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" });
                    registration.update();
                } catch {
                    // The app must still run if service workers are unavailable.
                }
            }
        })();
    </script>
</body>

</html>
